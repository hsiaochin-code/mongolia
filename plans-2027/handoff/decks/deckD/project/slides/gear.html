<section id="gear" data-transition="push" style="background:#F4F6F8;color:#12304A;font-family:'Noto Sans TC', Arial, sans-serif;padding:96px 128px 150px;display:flex;flex-direction:column;gap:28px"><div style="display:flex;flex-direction:column;gap:8px"><p style="font-size:26px;letter-spacing:5px;color:#B4552D;font-weight:700">出發前準備</p><h2 style="font-family:'Noto Serif TC', Georgia, serif;font-size:58px;font-weight:700;line-height:1.2">冬季穿搭、攝影器材與拍照禮儀</h2></div><div style="display:flex;gap:28px"><div style="flex:1;display:flex;flex-direction:column;gap:12px;background:#FFFFFF;border:1px solid #DCE3EA;border-radius:18px;padding:28px 32px"><p style="font-family:'Noto Serif TC', Georgia, serif;font-size:36px;font-weight:700;color:#B4552D">冬季穿搭</p><p style="font-size:26px;line-height:1.45">發熱衣＋刷毛或羽絨中層＋防水外套</p><p style="font-size:26px;line-height:1.45">高筒防水雪靴＋簡易冰爪（真山神社、角館、乳頭雪道）</p><p style="font-size:26px;line-height:1.45">毛帽、頸套、手套＋觸控薄手套</p><p style="font-size:26px;line-height:1.45">東京和東北溫差大，洋蔥式穿法</p></div><div style="flex:1;display:flex;flex-direction:column;gap:12px;background:#FFFFFF;border:1px solid #DCE3EA;border-radius:18px;padding:28px 32px"><p style="font-family:'Noto Serif TC', Georgia, serif;font-size:36px;font-weight:700;color:#B4552D">攝影器材</p><p style="font-size:26px;line-height:1.45">備用電池 3–4 顆，放貼身口袋</p><p style="font-size:26px;line-height:1.45">進室內前相機裝密封夾鏈袋，防結露</p><p style="font-size:26px;line-height:1.45">雪景曝光補償 +1 到 +1.7</p><p style="font-size:26px;line-height:1.45">藍調、夜景：ISO 1600–3200，靠牆或迷你腳架</p><p style="font-size:26px;line-height:1.45">換鏡頭時背對風</p></div><div style="flex:1;display:flex;flex-direction:column;gap:12px;background:#FFFFFF;border:1px solid #DCE3EA;border-radius:18px;padding:28px 32px"><p style="font-family:'Noto Serif TC', Georgia, serif;font-size:36px;font-weight:700;color:#B4552D">拍照禮儀</p><p style="font-size:26px;line-height:1.45">浴場內禁止拍照</p><p style="font-size:26px;line-height:1.45">有人在泡的露天絕對不拍</p><p style="font-size:26px;line-height:1.45">傳承館先問能不能拍、閃光燈</p><p style="font-size:26px;line-height:1.45">淺草寺、角館架腳架不擋路</p><p style="font-size:26px;line-height:1.45">每個點不停超過 2–3 分鐘</p></div></div><p style="position:absolute;right:128px;bottom:64px;width:700px;text-align:right;font-size:24px;color:#5B6878">東北雪國 D｜少換宿手冊　42</p></section>
