<section id="onsen-manner" data-transition="fade" style="background:#F4F6F8;color:#1D3A4A;font-family:'Noto Sans TC', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:32px"><div style="display:flex;flex-direction:column;gap:12px"><p style="font-size:26px;letter-spacing:6px;color:#2E7D73;font-weight:700">溫泉篇</p><h2 style="font-family:'Noto Serif TC', Georgia, serif;font-size:56px;font-weight:700;line-height:1.2">泡湯禮儀 6 件事</h2></div><div style="display:flex;gap:40px;flex:1"><div style="flex:1;display:grid;grid-template-columns:1fr 1fr;gap:24px"><div style="flex:1;display:flex;flex-direction:column;gap:10px;background:#FFFFFF;border:1px solid #DCE3E8;padding:28px 32px;border-radius:20px"><h3 style="font-size:32px;font-weight:700;color:#2E7D73;line-height:1.3">先洗再泡</h3><p style="font-size:26px;line-height:1.45;color:#1D3A4A">先沖洗身體再入池；頭髮綁起來不碰水，毛巾不放進浴池。</p></div><div style="flex:1;display:flex;flex-direction:column;gap:10px;background:#FFFFFF;border:1px solid #DCE3E8;padding:28px 32px;border-radius:20px"><h3 style="font-size:32px;font-weight:700;color:#2E7D73;line-height:1.3">浴場不拍照</h3><p style="font-size:26px;line-height:1.45;color:#1D3A4A">有人沒人都不拍；只有貸切、且館方同意才拍空浴池。</p></div><div style="flex:1;display:flex;flex-direction:column;gap:10px;background:#FFFFFF;border:1px solid #DCE3E8;padding:28px 32px;border-radius:20px"><h3 style="font-size:32px;font-weight:700;color:#2E7D73;line-height:1.3">強酸性泉</h3><p style="font-size:26px;line-height:1.45;color:#1D3A4A">藏王是強酸性硫磺泉：泡完用清水沖一下，飾品、銀器先拿下來。</p></div><div style="flex:1;display:flex;flex-direction:column;gap:10px;background:#FFFFFF;border:1px solid #DCE3E8;padding:28px 32px;border-radius:20px"><h3 style="font-size:32px;font-weight:700;color:#2E7D73;line-height:1.3">一次 5–10 分</h3><p style="font-size:26px;line-height:1.45;color:#1D3A4A">多補水；喝酒後不要泡，身體不舒服就先休息。</p></div><div style="flex:1;display:flex;flex-direction:column;gap:10px;background:#FFFFFF;border:1px solid #DCE3E8;padding:28px 32px;border-radius:20px"><h3 style="font-size:32px;font-weight:700;color:#2E7D73;line-height:1.3">帶零錢</h3><p style="font-size:26px;line-height:1.45;color:#1D3A4A">共同浴場投幣；準備 ¥100、¥500 硬幣與千元鈔，相機錢包留旅館。</p></div><div style="flex:1;display:flex;flex-direction:column;gap:10px;background:#FFFFFF;border:1px solid #DCE3E8;padding:28px 32px;border-radius:20px"><h3 style="font-size:32px;font-weight:700;color:#2E7D73;line-height:1.3">出浴場戴帽</h3><p style="font-size:26px;line-height:1.45;color:#1D3A4A">濕頭髮在外面會結冰；溫泉街坡道夜間結冰，穿防滑靴。</p></div></div><img src="IMG:zao_kamiyu_night" alt="藏王共同浴場上湯的木造外觀夜景" style="width:480px;height:645px;object-fit:cover;border-radius:20px"></div><p style="position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#6B7C88">東北雪國慢遊｜B 輕鬆慢遊版　·　溫泉禮儀</p></section>
